[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-code-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "discord.py>=2.3",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4.0",
    "croniter>=2.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["canvas_code_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
